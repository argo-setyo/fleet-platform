services:
  db:
    image: postgres:18
    container_name: fleet-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fleet
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 ke atas: data disimpan di bawah /var/lib/postgresql
      - fleet-db-data:/var/lib/postgresql

volumes:
  fleet-db-data: